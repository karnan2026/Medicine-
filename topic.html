<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic — Medicine</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="page">
  <a href="index.html" class="back-link">&larr; Today's feed</a>

  <div id="topicWrap">
    <div class="loading">Loading topic…</div>
  </div>
</div>

<script src="supabase-client.js?v=2"></script>
<script>
(async function init() {
  await renderNav("feed");

  const params = new URLSearchParams(window.location.search);
  const topicId = params.get("id");
  const wrap = document.getElementById("topicWrap");

  if (!topicId) {
    wrap.innerHTML = `<div class="empty-state">No topic was specified.</div>`;
    return;
  }

  const { data: { session } } = await db.auth.getSession();

  let myRole = null;
  if (session) {
    const { data: myProfile } = await db
      .from("profiles")
      .select("role")
      .eq("id", session.user.id)
      .maybeSingle();
    myRole = myProfile ? myProfile.role : "member";
  }
  const canReview = myRole === "reviewer" || myRole === "admin";

  await loadTopic();

  async function loadTopic() {
    const { data: topic, error } = await db
      .from("topics")
      .select(`
        id, title, body, created_at, created_by,
        systems ( id, name ),
        profiles!topics_created_by_fkey ( display_name )
      `)
      .eq("id", topicId)
      .eq("is_deleted", false)
      .maybeSingle();

    if (error || !topic) {
      wrap.innerHTML = `<div class="empty-state">This topic couldn't be found.</div>`;
      return;
    }

    document.title = topic.title + " — Medicine";

    const isAdmin = myRole === "admin";
    const canEditTopic = session && (session.user.id === topic.created_by || isAdmin);

    const { data: answers, error: ansError } = await db
      .from("answers")
      .select(`
        id, body, status, created_at, reviewed_at, created_by,
        author:profiles!answers_created_by_fkey ( display_name ),
        reviewer:profiles!answers_reviewed_by_fkey ( display_name )
      `)
      .eq("topic_id", topicId)
      .eq("is_deleted", false)
      .order("created_at", { ascending: true });

    const author = topic.profiles ? topic.profiles.display_name : "Unknown";
    const systemName = topic.systems ? topic.systems.name : "Uncategorized";

    wrap.innerHTML = `
      <div class="topic-header" id="topicHeader">
        <div class="topic-top">
          <a class="tag" href="system.html?id=${topic.systems ? topic.systems.id : ''}" style="text-decoration:none;">${escapeHtml(systemName)}</a>
        </div>
        <div class="topic-title">${escapeHtml(topic.title)}</div>
        <div class="topic-meta">
          <span>${escapeHtml(author)}</span>
          <span>${dateGroupLabel(topic.created_at)}, ${timeLabel(topic.created_at)}</span>
        </div>
        <div class="topic-body">${escapeHtml(topic.body)}</div>
        ${canEditTopic ? `
          <div style="margin-top:12px;">
            <button class="admin-btn" id="editTopicBtn">Edit</button>
            <button class="admin-btn danger" id="deleteTopicBtn">Delete</button>
          </div>
        ` : ""}
      </div>

      <div class="answers-heading">${answers ? answers.length : 0} Answer${answers && answers.length === 1 ? '' : 's'}</div>

      <div id="answersList">
        ${answers && answers.length > 0
          ? answers.map(a => renderAnswer(a)).join("")
          : `<div class="empty-state">No answers yet.</div>`}
      </div>

      <div class="form-card" style="margin-top:20px;">
        ${session ? `
          <form id="answerForm">
            <div class="field">
              <label for="answerBody">Your answer</label>
              <textarea id="answerBody" required placeholder="Share your answer to this question…"></textarea>
            </div>
            <div class="msg" id="answerMsg"></div>
            <button type="submit" class="btn btn-primary" id="answerSubmitBtn" style="width:auto;">Post answer</button>
          </form>
        ` : `
          <p style="color:var(--text-dim); font-size:14px; margin:0;">
            <a href="auth.html" style="color:var(--teal);">Sign in</a> to post an answer.
          </p>
        `}
      </div>
    `;

    if (canEditTopic) {
      document.getElementById("editTopicBtn").addEventListener("click", () => {
        showTopicEditForm(topic);
      });
      document.getElementById("deleteTopicBtn").addEventListener("click", async () => {
        if (!confirm("Delete this topic? This can't be undone from the site.")) return;
        const { error: delError } = await db
          .from("topics")
          .update({ is_deleted: true, updated_by: session.user.id, updated_at: new Date().toISOString() })
          .eq("id", topicId);
        if (delError) {
          alert(delError.message);
          return;
        }
        window.location.href = "index.html";
      });
    }

    if (session) {
      document.getElementById("answerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const answerMsg = document.getElementById("answerMsg");
        const btn = document.getElementById("answerSubmitBtn");
        const body = document.getElementById("answerBody").value.trim();

        if (!body) return;

        btn.disabled = true;
        btn.textContent = "Posting…";

        const { error: insertError } = await db.from("answers").insert({
          topic_id: topicId,
          body,
          created_by: session.user.id,
        });

        if (insertError) {
          answerMsg.className = "msg show error";
          answerMsg.textContent = insertError.message;
          btn.disabled = false;
          btn.textContent = "Post answer";
          return;
        }

        await loadTopic();
      });
    }

    if (canReview) {
      document.querySelectorAll(".mark-correct, .mark-wrong").forEach(btn => {
        btn.addEventListener("click", async () => {
          const answerId = btn.dataset.answerId;
          const verdict = btn.classList.contains("mark-correct") ? "correct" : "wrong";
          btn.disabled = true;

          const { error: reviewError } = await db.rpc("review_answer", {
            p_answer_id: answerId,
            p_verdict: verdict,
            p_note: null,
          });

          if (reviewError) {
            alert(reviewError.message);
            btn.disabled = false;
            return;
          }

          await loadTopic();
        });
      });
    }

    document.querySelectorAll(".edit-answer-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const answerId = btn.dataset.answerId;
        const card = document.getElementById("answer-" + answerId);
        const currentBody = decodeURIComponent(btn.dataset.body);
        card.innerHTML = `
          <div class="field">
            <textarea id="editAnswerBody-${answerId}">${escapeHtml(currentBody)}</textarea>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" id="saveAnswerBtn-${answerId}" style="width:auto;">Save</button>
            <button class="btn btn-secondary" id="cancelAnswerBtn-${answerId}" style="width:auto;">Cancel</button>
          </div>
        `;
        document.getElementById("saveAnswerBtn-" + answerId).addEventListener("click", async () => {
          const newBody = document.getElementById("editAnswerBody-" + answerId).value.trim();
          if (!newBody) return;

          const { error: updateError } = await db
            .from("answers")
            .update({ body: newBody, updated_by: session.user.id, updated_at: new Date().toISOString() })
            .eq("id", answerId);

          if (updateError) {
            alert(updateError.message);
            return;
          }

          await db.from("answer_revisions").insert({
            answer_id: answerId,
            body: newBody,
            edited_by: session.user.id,
          });

          await loadTopic();
        });
        document.getElementById("cancelAnswerBtn-" + answerId).addEventListener("click", () => loadTopic());
      });
    });

    document.querySelectorAll(".delete-answer-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this answer?")) return;
        const answerId = btn.dataset.answerId;
        const { error: delError } = await db
          .from("answers")
          .update({ is_deleted: true, updated_by: session.user.id, updated_at: new Date().toISOString() })
          .eq("id", answerId);
        if (delError) {
          alert(delError.message);
          return;
        }
        await loadTopic();
      });
    });
  }

  function showTopicEditForm(topic) {
    const headerEl = document.getElementById("topicHeader");
    headerEl.innerHTML = `
      <div class="field">
        <label for="editTitle">Title</label>
        <input type="text" id="editTitle" value="${escapeHtml(topic.title)}">
      </div>
      <div class="field">
        <label for="editBody">Details</label>
        <textarea id="editBody">${escapeHtml(topic.body)}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveTopicBtn" style="width:auto;">Save</button>
        <button class="btn btn-secondary" id="cancelTopicBtn" style="width:auto;">Cancel</button>
      </div>
    `;

    document.getElementById("saveTopicBtn").addEventListener("click", async () => {
      const newTitle = document.getElementById("editTitle").value.trim();
      const newBody = document.getElementById("editBody").value.trim();
      if (!newTitle || !newBody) return;

      const { data: { session } } = await db.auth.getSession();

      const { error: updateError } = await db
        .from("topics")
        .update({ title: newTitle, body: newBody, updated_by: session.user.id, updated_at: new Date().toISOString() })
        .eq("id", topicId);

      if (updateError) {
        alert(updateError.message);
        return;
      }

      await db.from("topic_revisions").insert({
        topic_id: topicId,
        body: newBody,
        edited_by: session.user.id,
      });

      await loadTopic();
    });

    document.getElementById("cancelTopicBtn").addEventListener("click", () => loadTopic());
  }

  function renderAnswer(a) {
    const authorProfile = a.author;
    const author = authorProfile ? authorProfile.display_name : "Unknown";
    const reviewerProfile = a.reviewer;
    const status = a.status || "unverified";
    const cardClass = status === "correct" ? "verdict-correct" : status === "wrong" ? "verdict-wrong" : "";
    const isAdmin = myRole === "admin";
    const canEditAnswer = session && (session.user.id === a.created_by || isAdmin);

    let reviewLine = "";
    if (status !== "unverified" && reviewerProfile) {
      reviewLine = `<div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">Reviewed by ${escapeHtml(reviewerProfile.display_name)}</div>`;
    }

    const reviewButtons = canReview ? `
      <div class="review-controls">
        <button class="mark-correct" data-answer-id="${a.id}">Mark correct</button>
        <button class="mark-wrong" data-answer-id="${a.id}">Mark wrong</button>
      </div>
    ` : "";

    const ownerButtons = canEditAnswer ? `
      <div style="margin-top:10px;">
        <button class="admin-btn edit-answer-btn" data-answer-id="${a.id}" data-body="${encodeURIComponent(a.body)}">Edit</button>
        <button class="admin-btn danger delete-answer-btn" data-answer-id="${a.id}">Delete</button>
      </div>
    ` : "";

    return `
      <div class="answer-card ${cardClass}" id="answer-${a.id}">
        <div class="answer-body">${escapeHtml(a.body)}</div>
        <div class="answer-footer">
          <div class="topic-meta">
            <span>${escapeHtml(author)}</span>
            <span>${timeLabel(a.created_at)}</span>
            <span class="verdict-badge ${status}">${status}</span>
          </div>
          ${reviewButtons}
        </div>
        ${reviewLine}
        ${ownerButtons}
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
