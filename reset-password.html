<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Medicine</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B8074">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="trace" viewBox="0 0 400 44" preserveAspectRatio="none">
      <defs>
        <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0B8074" />
          <stop offset="100%" stop-color="#6D5DD3" />
        </linearGradient>
      </defs>
      <path d="M0,22 L110,22 L125,8 L140,36 L155,22 L400,22" />
    </svg>

    <div class="auth-body">
      <div class="eyebrow">Medicine</div>
      <h1>Set a new password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <div class="msg" id="msg"></div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Update password</button>
      </form>
    </div>
  </div>
</div>

<script src="supabase-client.js?v=2"></script>
<script>
const msg = document.getElementById("msg");
const form = document.getElementById("resetForm");
const submitBtn = document.getElementById("submitBtn");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg show " + type;
}

// Supabase reads the recovery token out of the URL automatically and
// fires this event once the session is ready for a password update.
let recoveryReady = false;
db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    recoveryReady = true;
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg";

  const newPassword = document.getElementById("newPassword").value;
  if (!newPassword || newPassword.length < 6) {
    showMsg("Password must be at least 6 characters.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating…";

  const { error } = await db.auth.updateUser({ password: newPassword });

  if (error) {
    showMsg(error.message, "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Update password";
    return;
  }

  showMsg("Password updated. Redirecting…", "ok");
  setTimeout(() => { window.location.href = "index.html"; }, 1500);
});
</script>

</body>
</html>
