<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Medicine</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="trace" viewBox="0 0 400 44" preserveAspectRatio="none">
      <defs>
        <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0B8074" />
          <stop offset="100%" stop-color="#6D5DD3" />
        </linearGradient>
      </defs>
      <path d="M0,22 L110,22 L125,8 L140,36 L155,22 L400,22" />
    </svg>

    <div class="auth-body">
      <div class="eyebrow">Medicine</div>
      <h1 id="formTitle">Sign in</h1>
      <p class="auth-sub" id="formSub">Enter your credentials to continue.</p>

      <div class="msg" id="msg"></div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="displayName">Display name</label>
          <input type="text" id="displayName" autocomplete="name" placeholder="How others will see you">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div style="text-align:center; margin-top:10px;">
        <button type="button" id="forgotBtn" style="background:none; border:none; color:var(--text-dim); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0;">Forgot password?</button>
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin:20px 0;">
        <div style="flex:1; height:1px; background:var(--hairline);"></div>
        <span style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim);">OR</span>
        <div style="flex:1; height:1px; background:var(--hairline);"></div>
      </div>

      <button type="button" id="googleBtn" class="btn btn-secondary" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="switch-mode">
        <span id="switchText">Don't have an account?</span>
        <button type="button" id="switchBtn">Create one</button>
      </div>
    </div>
  </div>
</div>

<script src="supabase-client.js?v=2"></script>
<script>
let mode = "signin"; // or "signup"

const form = document.getElementById("authForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");
const nameField = document.getElementById("nameField");
const formTitle = document.getElementById("formTitle");
const formSub = document.getElementById("formSub");
const switchText = document.getElementById("switchText");
const switchBtn = document.getElementById("switchBtn");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg show " + type;
}

function clearMsg() {
  msg.className = "msg";
}

switchBtn.addEventListener("click", () => {
  mode = mode === "signin" ? "signup" : "signin";
  clearMsg();
  if (mode === "signup") {
    formTitle.textContent = "Create account";
    formSub.textContent = "Join to write and edit discussion topics.";
    nameField.style.display = "block";
    document.getElementById("displayName").required = true;
    document.getElementById("password").autocomplete = "new-password";
    submitBtn.textContent = "Create account";
    switchText.textContent = "Already have an account?";
    switchBtn.textContent = "Sign in";
  } else {
    formTitle.textContent = "Sign in";
    formSub.textContent = "Enter your credentials to continue.";
    nameField.style.display = "none";
    document.getElementById("displayName").required = false;
    document.getElementById("password").autocomplete = "current-password";
    submitBtn.textContent = "Sign in";
    switchText.textContent = "Don't have an account?";
    switchBtn.textContent = "Create one";
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  submitBtn.disabled = true;
  submitBtn.textContent = mode === "signup" ? "Creating…" : "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const displayName = document.getElementById("displayName").value.trim();

  try {
    if (mode === "signup") {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { display_name: displayName } },
      });
      if (error) throw error;

      if (data.user) {
        await ensureProfile(data.user, displayName);
      }

      if (!data.session) {
        showMsg("Account created. Check your email to confirm, then sign in — your account will be activated within 24 hours.", "ok");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
        return;
      }

      window.location.href = "index.html";
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = "index.html";
    }
  } catch (err) {
    showMsg(err.message || "Something went wrong. Try again.", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = mode === "signup" ? "Create account" : "Sign in";
  }
});

// If already signed in, skip straight to the app.
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) window.location.href = "index.html";
})();

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showMsg("Enter your email above first, then tap 'Forgot password?' again.", "error");
    return;
  }

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname.replace("auth.html", "reset-password.html"),
  });

  if (error) {
    showMsg(error.message, "error");
    return;
  }

  showMsg("Password reset email sent. Check your inbox.", "ok");
});

document.getElementById("googleBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + window.location.pathname.replace("auth.html", "index.html"),
    },
  });
  if (error) showMsg(error.message, "error");
});
</script>

</body>
</html>
