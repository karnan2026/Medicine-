<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New topic — Medicine</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B8074">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="page" style="max-width:640px;">
  <a href="index.html" class="back-link">&larr; Today's feed</a>
  <div class="page-header">
    <h1>Start a new topic</h1>
  </div>

  <div class="msg" id="msg"></div>

  <div class="form-card">
    <form id="topicForm">
      <div class="field">
        <label for="system">System</label>
        <select id="system" required>
          <option value="">Loading systems…</option>
        </select>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Mechanism of action of ACE inhibitors in heart failure">
      </div>

      <div class="field">
        <label for="body">Details</label>
        <textarea id="body" required placeholder="Describe the question or case in detail…"></textarea>
      </div>

      <div class="field">
        <label for="image">Photos (optional, up to 5)</label>
        <input type="file" id="image" accept="image/*" multiple>
        <div id="imagePreviewGrid" class="image-preview-grid"></div>
      </div>

      <div class="field">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="scheduleToggle" style="width:auto;">
          <span>Schedule for later instead of posting now</span>
        </label>
        <div id="scheduleFieldWrap" style="display:none; margin-top:10px;">
          <input type="datetime-local" id="scheduleAt">
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:auto;">Post topic</button>
        <a href="index.html" class="btn btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="supabase-client.js?v=2"></script>
<script>
(async function init() {
  const session = await requireAuth();
  if (!session) return;

  await renderNav("feed");

  const systemSelect = document.getElementById("system");
  const { data: systems, error: sysError } = await db
    .from("systems")
    .select("id, name")
    .order("sort_order", { ascending: true });

  if (sysError || !systems || systems.length === 0) {
    systemSelect.innerHTML = `<option value="">No systems available</option>`;
  } else {
    systemSelect.innerHTML =
      `<option value="">Choose a system…</option>` +
      systems.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  }

  const form = document.getElementById("topicForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const imageInput = document.getElementById("image");
  const imagePreviewGrid = document.getElementById("imagePreviewGrid");

  const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5 MB per file
  const MAX_IMAGES = 5;
  let selectedFiles = [];

  const scheduleToggle = document.getElementById("scheduleToggle");
  const scheduleFieldWrap = document.getElementById("scheduleFieldWrap");
  const scheduleAt = document.getElementById("scheduleAt");

  scheduleToggle.addEventListener("change", () => {
    scheduleFieldWrap.style.display = scheduleToggle.checked ? "block" : "none";
    if (!scheduleToggle.checked) scheduleAt.value = "";
  });

  function renderPreviews() {
    imagePreviewGrid.innerHTML = selectedFiles.map((file, i) => `
      <div class="image-preview-item">
        <img src="${URL.createObjectURL(file)}" alt="">
        <button type="button" class="image-preview-remove" data-index="${i}" aria-label="Remove">&times;</button>
      </div>
    `).join("");

    imagePreviewGrid.querySelectorAll(".image-preview-remove").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedFiles.splice(Number(btn.dataset.index), 1);
        renderPreviews();
      });
    });
  }

  imageInput.addEventListener("change", () => {
    msg.className = "msg";
    const newFiles = Array.from(imageInput.files || []);
    imageInput.value = ""; // reset so picking the same file again still fires "change"

    for (const file of newFiles) {
      if (selectedFiles.length >= MAX_IMAGES) {
        msg.className = "msg show error";
        msg.textContent = `You can attach up to ${MAX_IMAGES} photos.`;
        break;
      }
      if (!file.type.startsWith("image/")) {
        msg.className = "msg show error";
        msg.textContent = "Please choose image files only.";
        continue;
      }
      if (file.size > MAX_IMAGE_BYTES) {
        msg.className = "msg show error";
        msg.textContent = `"${file.name}" is over 5 MB — please choose a smaller image.`;
        continue;
      }
      selectedFiles.push(file);
    }
    renderPreviews();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";

    const system_id = systemSelect.value;
    const title = document.getElementById("title").value.trim();
    const body = document.getElementById("body").value.trim();

    if (!system_id || !title || !body) {
      msg.className = "msg show error";
      msg.textContent = "Please fill in every field.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Post topic";
      return;
    }

    let publish_at = null;
    if (scheduleToggle.checked) {
      if (!scheduleAt.value) {
        msg.className = "msg show error";
        msg.textContent = "Pick a date and time to schedule for, or uncheck scheduling to post now.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Post topic";
        return;
      }
      const chosen = new Date(scheduleAt.value);
      if (chosen.getTime() <= Date.now()) {
        msg.className = "msg show error";
        msg.textContent = "Scheduled time must be in the future.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Post topic";
        return;
      }
      publish_at = chosen.toISOString();
    }

    const insertPayload = { system_id, title, body, created_by: session.user.id };
    if (publish_at) insertPayload.publish_at = publish_at;

    const { data, error } = await db
      .from("topics")
      .insert(insertPayload)
      .select("id")
      .single();

    if (error) {
      msg.className = "msg show error";
      msg.textContent = error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = "Post topic";
      return;
    }

    const topicId = data.id;

    if (selectedFiles.length > 0) {
      submitBtn.textContent = "Uploading photos…";
      let failedCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
        const path = `${session.user.id}/${Date.now()}-${i}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

        const { error: uploadError } = await db.storage
          .from("topic-images")
          .upload(path, file, { cacheControl: "3600", upsert: false });

        if (uploadError) {
          failedCount++;
          continue;
        }

        const { data: publicUrlData } = db.storage.from("topic-images").getPublicUrl(path);
        await db.from("topic_images").insert({
          topic_id: topicId,
          image_url: publicUrlData.publicUrl,
          sort_order: i,
        });
      }

      if (failedCount > 0) {
        // The topic itself already posted successfully — just let the
        // person know some photos didn't make it, without blocking them.
        alert(`Topic posted, but ${failedCount} photo(s) failed to upload. You can view the topic and it will show the ones that succeeded.`);
      }
    }

    window.location.href = "topic.html?id=" + topicId;
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
