<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New topic — Medicine</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B8074">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="nav" id="nav"></nav>

<div class="page" style="max-width:640px;">
  <a href="index.html" class="back-link">&larr; Today's feed</a>
  <div class="page-header">
    <h1>Start a new topic</h1>
  </div>

  <div class="msg" id="msg"></div>

  <div class="form-card">
    <form id="topicForm">
      <div class="field">
        <label for="system">System</label>
        <select id="system" required>
          <option value="">Loading systems…</option>
        </select>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Mechanism of action of ACE inhibitors in heart failure">
      </div>

      <div class="field">
        <label for="body">Details</label>
        <textarea id="body" required placeholder="Describe the question or case in detail…"></textarea>
      </div>

      <div class="field">
        <label for="image">Photo (optional)</label>
        <input type="file" id="image" accept="image/*">
        <div id="imagePreviewWrap" style="display:none; margin-top:10px;">
          <img id="imagePreview" style="max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--hairline); display:block;">
          <button type="button" id="removeImageBtn" class="admin-btn danger" style="margin-top:8px;">Remove photo</button>
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:auto;">Post topic</button>
        <a href="index.html" class="btn btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="supabase-client.js?v=2"></script>
<script>
(async function init() {
  const session = await requireAuth();
  if (!session) return;

  await renderNav("feed");

  const systemSelect = document.getElementById("system");
  const { data: systems, error: sysError } = await db
    .from("systems")
    .select("id, name")
    .order("sort_order", { ascending: true });

  if (sysError || !systems || systems.length === 0) {
    systemSelect.innerHTML = `<option value="">No systems available</option>`;
  } else {
    systemSelect.innerHTML =
      `<option value="">Choose a system…</option>` +
      systems.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
  }

  const form = document.getElementById("topicForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const imageInput = document.getElementById("image");
  const imagePreviewWrap = document.getElementById("imagePreviewWrap");
  const imagePreview = document.getElementById("imagePreview");
  const removeImageBtn = document.getElementById("removeImageBtn");

  const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5 MB

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    msg.className = "msg";
    if (!file) {
      imagePreviewWrap.style.display = "none";
      return;
    }
    if (!file.type.startsWith("image/")) {
      msg.className = "msg show error";
      msg.textContent = "Please choose an image file.";
      imageInput.value = "";
      imagePreviewWrap.style.display = "none";
      return;
    }
    if (file.size > MAX_IMAGE_BYTES) {
      msg.className = "msg show error";
      msg.textContent = "That image is over 5 MB — please choose a smaller one.";
      imageInput.value = "";
      imagePreviewWrap.style.display = "none";
      return;
    }
    imagePreview.src = URL.createObjectURL(file);
    imagePreviewWrap.style.display = "block";
  });

  removeImageBtn.addEventListener("click", () => {
    imageInput.value = "";
    imagePreviewWrap.style.display = "none";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";

    const system_id = systemSelect.value;
    const title = document.getElementById("title").value.trim();
    const body = document.getElementById("body").value.trim();
    const imageFile = imageInput.files[0] || null;

    if (!system_id || !title || !body) {
      msg.className = "msg show error";
      msg.textContent = "Please fill in every field.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Post topic";
      return;
    }

    let image_url = null;

    if (imageFile) {
      submitBtn.textContent = "Uploading photo…";
      const ext = (imageFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = `${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: uploadError } = await db.storage
        .from("topic-images")
        .upload(path, imageFile, { cacheControl: "3600", upsert: false });

      if (uploadError) {
        msg.className = "msg show error";
        msg.textContent = "Couldn't upload the photo: " + uploadError.message + ". You can try again, or post without it.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Post topic";
        return;
      }

      const { data: publicUrlData } = db.storage.from("topic-images").getPublicUrl(path);
      image_url = publicUrlData ? publicUrlData.publicUrl : null;
      submitBtn.textContent = "Posting…";
    }

    const { data, error } = await db
      .from("topics")
      .insert({
        system_id,
        title,
        body,
        image_url,
        created_by: session.user.id,
      })
      .select("id")
      .single();

    if (error) {
      msg.className = "msg show error";
      msg.textContent = error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = "Post topic";
      return;
    }

    window.location.href = "topic.html?id=" + data.id;
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
